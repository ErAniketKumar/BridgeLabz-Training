<h1>Login Form</h1>

<form action="" method="post">
  <label for="username">Username</label>
  <input type="text" name="username" id="username" [formControl]="username" />
  <br />
  <br />
  <label for="password">Password</label>
  <input type="text" name="password" id="password" [formControl]="password" />
  <br />
  <br />
  <button type="button" (click)="HandleLoginForm()">Login</button>

  <button type="button"  (click)="HandleSetDefaultValue()" >Set Default Value</button>
</form>
