<h2>Counter App</h2>
<h3>Current Count: {{ count }}</h3>

<button (click)="Increment()">+</button>
<button (click)="Decrement()">-</button>

<h2>Counter app using signal</h2>

<h3>Current Count {{value()}}</h3>
<button (click)="counterFun('Inc')" >+</button>
<button (click)="counterFun('Dec')" >-</button>
