<h2>Counter App</h2>
<h3>Current Count: {{ count }}</h3>

<button (click)="Increment()">+</button>
<button (click)="Decrement()">-</button>

<h2>Counter app using signal</h2>

<h3>Current Count {{ value() }}</h3>
<button (click)="counterFun('Inc')">+</button>
<button (click)="counterFun('Dec')">-</button>

<h1>Computed signal</h1>
<h2>Fist Name: {{ fname() }}</h2>
<h2>Last Name: {{ lname() }}</h2>
<h2>FullName: {{ fullName() }}</h2>

<h1>Effect in signal</h1>
<h2 [style.color]="color">{{ speed() }}</h2>
<button (click)="IncreaseSpeed()">Speed++</button>
<button (click)="DecreaseSpeed()">Speed--</button>
